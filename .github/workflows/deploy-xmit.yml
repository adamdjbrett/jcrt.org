name: Deploy Eleventy to XMIT

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      site:
        description: "XMIT site/domain (e.g. jcrt.xmit.dev)"
        required: true
        type: string

concurrency:
  group: deploy-xmit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELEVENTY_RUN_MODE: build
  SKIP_PAGEFIND: "1"
  # Use cached theory data - skip GitHub ZIP download
  USE_CACHED_THEORY: "1"
  # Skip HTML transforms in CI for speed
  FAST_BUILD: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      XMIT_SITE: jcrt.xmit.dev@268
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build site
        run: |
          start_time=$(date +%s%3N)
          npx @11ty/eleventy --quiet &
          eleventy_pid=$!
          wait $eleventy_pid
          npx pagefind --site _site --glob "**/*.html" --force-language en
          end_time=$(date +%s%3N)
          echo "⚡ Build completed in $((end_time - start_time))ms"

      - name: Deploy to XMIT
        env:
          XMIT_KEY: ${{ secrets.XMIT_KEY }}
        run: |
          [ -z "$XMIT_KEY" ] && { echo "XMIT_KEY secret not set" >&2; exit 1; }
          SITE="${{ github.event_name == 'workflow_dispatch' && inputs.site || env.XMIT_SITE }}"
          echo "Deploying to $SITE"
          npx -y @xmit.co/xmit "$SITE" _site

      - name: Summary
        run: echo "✅ Deployed to https://${{ env.XMIT_SITE }}"
    #       tar -czf site.tar.gz -C _site .
    #       curl -f -X POST \
    #         -H "Authorization: Bearer $XMIT_KEY" \
    #         -F "bundle=@site.tar.gz" \
    #         https://api.xmit.example/deploy?site=$XMIT_SITE
